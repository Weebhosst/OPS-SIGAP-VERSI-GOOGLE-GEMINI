name: OPS SIGAP CI

on:
  push:
    branches:
      - main
      - "round4*"
      - "round5*"
      - "round6*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PROVIDER: json
      NODE_ENV: test
      OPS_SIGAP_DATA_FILE: /tmp/ops-sigap-ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated JSON database
        run: cp data/ops-sigap.json /tmp/ops-sigap-ci.json

      - name: TypeScript lint
        run: npm run lint

      - name: Domain and repository tests
        run: npm test

      - name: Production build
        run: npm run build

  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PROVIDER: json
      NODE_ENV: test
      OPS_SIGAP_DATA_FILE: /tmp/ops-sigap-runtime.json
      PORT: 3100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Prepare isolated runtime database
        run: cp data/ops-sigap.json /tmp/ops-sigap-runtime.json

      - name: Build with production dependency set
        run: npm run build

      - name: Start runtime through npm start
        run: |
          npm start > /tmp/ops-sigap-runtime.log 2>&1 &
          echo $! > /tmp/ops-sigap-runtime.pid

      - name: Verify runtime health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ops-sigap-runtime.log
          exit 1

      - name: Stop runtime
        if: always()
        run: |
          if [ -f /tmp/ops-sigap-runtime.pid ]; then
            kill "$(cat /tmp/ops-sigap-runtime.pid)" || true
          fi

  postgres-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ops_sigap
          POSTGRES_PASSWORD: ops_sigap_ci
          POSTGRES_DB: ops_sigap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_sigap -d ops_sigap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://ops_sigap:ops_sigap_ci@127.0.0.1:5432/ops_sigap_ci
      NODE_ENV: test
      CHECKPOINT_TOKEN_SECRET: ops-sigap-ci-checkpoint-secret-do-not-use-in-production
      OPS_SIGAP_IMPORT_FILE: data/ops-sigap.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live PostgreSQL migrations, import, and repository integration
        run: npm run test:postgres
