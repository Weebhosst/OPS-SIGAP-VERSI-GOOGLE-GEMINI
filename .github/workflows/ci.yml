name: OPS SIGAP CI

on:
  push:
    branches:
      - main
      - "round4*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PROVIDER: json
      NODE_ENV: test
      OPS_SIGAP_DATA_FILE: /tmp/ops-sigap-ci.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated JSON database
        run: cp data/ops-sigap.json /tmp/ops-sigap-ci.json

      - name: TypeScript lint
        run: npm run lint

      - name: Domain and repository tests
        run: npm test

      - name: Production build
        run: npm run build
